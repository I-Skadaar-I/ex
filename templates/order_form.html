{% extends "base.html" %}
{% block content %}
<h2 class="mt-3">{% if zakaz %}Редактирование{% else %}Добавление{% endif %} заказа</h2>
<form method="post">
    {% csrf_token %}
    <select name="polzovatel" class="form-select mb-2">
        {% for p in polzovateli %}
        <option value="{{ p.id }}" {% if zakaz.polzovatel_id == p.id %}selected{% endif %}>{{ p.fio }}</option>
        {% endfor %}
    </select>
    <select name="punkt_vydachi" class="form-select mb-2">
        {% for p in punkty %}
        <option value="{{ p.id }}" {% if zakaz.punkt_vydachi_id == p.id %}selected{% endif %}>{{ p.nazvanie|truncatechars:50 }}</option>
        {% endfor %}
    </select>
    <input type="date" name="data_zakaza" class="form-control mb-2" value="{{ zakaz.data_zakaza|date:'Y-m-d'|default:'' }}">
    <input type="date" name="data_dostavki" class="form-control mb-2" value="{{ zakaz.data_dostavki|date:'Y-m-d'|default:'' }}">
    <input name="kod_polucheniya" class="form-control mb-2" placeholder="Код получения" value="{{ zakaz.kod_polucheniya|default:'' }}">
    <select name="status" class="form-select mb-2">
        {% for s in statusy %}
        <option value="{{ s.id }}" {% if zakaz.status_id == s.id %}selected{% endif %}>{{ s.nazvanie }}</option>
        {% endfor %}
    </select>
    <button type="submit" class="btn btn-accent">Сохранить</button>
    <a href="/orders/" class="btn btn-secondary">Назад</a>
</form>
{% endblock %}
